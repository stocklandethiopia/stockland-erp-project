name: "CodeQL Advanced"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "26 21 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      packages: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Report ERP source coverage
        shell: bash
        run: |
          if [ ! -f "stockland-erp-app/stockland-inventory.php" ] && ! git ls-files '*.php' | grep -q .; then
            echo "::warning title=ERP source missing::This repository does not track the Stockland ERP PHP plugin source. This CodeQL run can only cover tracked JavaScript and GitHub Actions files; it is not a complete ERP scan."
          fi
          if ! git ls-files '*.js' | grep -q .; then
            echo "::warning title=ERP JavaScript source missing::No JavaScript source is tracked in this repository. The packaged ERP assets must be committed or supplied to CI to receive JavaScript CodeQL coverage."
          fi

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended,security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
