name: "CodeQL Advanced"

on:
  push:
    branches: ["main", "audit/**"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "26 21 * * 1"

permissions:
  contents: read

jobs:
  detect-source:
    runs-on: ubuntu-latest
    outputs:
      has_javascript: ${{ steps.detect.outputs.has_javascript }}
    steps:
      - uses: actions/checkout@v4
      - id: detect
        shell: bash
        run: |
          if git ls-files '*.js' '*.jsx' '*.ts' '*.tsx' | grep -q .; then
            echo "has_javascript=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_javascript=false" >> "$GITHUB_OUTPUT"
          fi

  analyze-actions:
    name: Analyze GitHub Actions workflows
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      packages: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: actions
          queries: security-extended,security-and-quality
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:actions"

  analyze-javascript:
    name: Analyze JavaScript / TypeScript
    needs: detect-source
    if: ${{ needs.detect-source.outputs.has_javascript == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      packages: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended,security-and-quality
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
