name: "CodeQL Advanced"

on:
  push:
    branches: ["main", "audit/**"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "26 21 * * 1"

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      has_javascript: ${{ steps.detect.outputs.has_javascript }}
    steps:
      - uses: actions/checkout@v4
      - id: detect
        shell: bash
        run: |
          if git ls-files '*.js' '*.jsx' '*.ts' '*.tsx' | grep -q .; then
            echo "has_javascript=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_javascript=false" >> "$GITHUB_OUTPUT"
          fi

  analyze:
    needs: detect
    if: ${{ matrix.language == 'actions' || needs.detect.outputs.has_javascript == 'true' }}
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      packages: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended,security-and-quality
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
