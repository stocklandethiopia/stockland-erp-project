name: Stockland ERP CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']
        node: ['22']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml, dom, zip, fileinfo
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Validate Composer manifest
        run: composer validate --strict

      - name: Install development dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: PHPUnit unit tests
        run: composer test

      - name: WordPress coding standards
        run: composer lint:php

      - name: ERP static release QA
        run: composer qa

      - name: JavaScript syntax
        run: |
          node --check assets/app.js
          node --check assets/pwa.js

      - name: ZIP/runtime residue gate
        shell: bash
        run: |
          if find . -type f \
            \( -name '*.zip' -o -name '*.log' -o -name '*.bak' -o -name '*.orig' -o -name '*.old' \\) \
            -print -quit | grep -q .; then
            echo 'Unexpected runtime residue found'
            exit 1
          fi
